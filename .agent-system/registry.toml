[[skills]]
id = "testing"
path = "skills/testing"
priority = 50
path_globs = ["scripts/tests/**", "apps/**/tests/**"]
keywords = ["test", "tests", "testing", "regression", "quality gate", "verification"]
labels = ["testing"]
