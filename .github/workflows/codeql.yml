name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "21 5 * * 2"
permissions:
  contents: read
  security-events: write
  actions: read
concurrency:
  group: codeql-${{ github.event_name == 'schedule' && 'schedule' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with: { languages: "${{ matrix.language }}" }
      - uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
