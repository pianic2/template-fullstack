name: ${COMPOSE_PROJECT_NAME:-template-fullstack}

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
      target: development
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "true"
      UV_EXTRA_ARGS: ${UV_EXTRA_ARGS:-}
      S3_STORAGE_ENABLED: ${S3_STORAGE_ENABLED:-false}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minio-development-only}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes: [./apps/backend:/app, backend-venv:/app/.venv]
    command: ["sh", "-c", "uv sync --all-groups $${UV_EXTRA_ARGS} && uv run python manage.py runserver 0.0.0.0:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      target: development
    environment:
      VITE_API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
    ports: ["127.0.0.1:${WEB_PORT:-5173}:5173"]
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/node_modules
    command: ["corepack", "pnpm", "--filter", "@template/web", "dev", "--host", "0.0.0.0"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2026-02-11T19-13-46Z
    profiles: [storage]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minio-development-only}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio-data:/data]

  mailpit:
    image: axllent/mailpit:v1.27.8
    profiles: [email]
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  postgres-data:
  backend-venv:
  web-node-modules:
  minio-data:
